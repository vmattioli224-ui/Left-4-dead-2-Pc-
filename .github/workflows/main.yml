name: Gerar L4D2Test.exe
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar arquivos
        shell: pwsh
        run: |
          Expand-Archive 'L4D2-GameHub-exe.zip' -DestinationPath . -Force
          "APP_DIR=L4D2-GameHub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Instalar
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund
          Invoke-WebRequest https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -OutFile vendor/three.min.js
      - name: Gerar exe
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx electron-packager . L4D2Test --platform=win32 --arch=x64 --out=dist --overwrite --asar=false --ignore="^/(dist|servidor|.github|BUILD-EXE|LEIA-ME)"
          Copy-Item config.json dist/L4D2Test-win32-x64/config.json
          Copy-Item servidor dist/L4D2Test-win32-x64/servidor -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: L4D2Test-exe
          path: ${{ env.APP_DIR }}/dist/L4D2Test-win32-x64
